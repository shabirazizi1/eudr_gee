services:
  backend:
    build: ./backend
    env_file:
      - backend/.env
    environment:
      - DB_URL=sqlite:////data/eudr.db
      - UPLOADS_DIR=/data/uploads
      - FRONTEND_URL=http://localhost:8080
    volumes:
      - db_data:/data
      - ~/.config/earthengine:/root/.config/earthengine:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
