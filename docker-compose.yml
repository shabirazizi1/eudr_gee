services:
  backend:
    build: ./backend
    env_file:
      # .env.example ships sensible defaults (GEE_PROJECT, ALLOW_MOCK_FALLBACK=true, ...) so a
      # fresh clone works with no setup step; backend/.env (gitignored, optional) overrides them
      # for a personal Earth Engine project or local tweaks -- later files win on shared keys.
      - backend/.env.example
      - path: backend/.env
        required: false
    environment:
      - DB_URL=sqlite:////data/eudr.db
      - UPLOADS_DIR=/data/uploads
      - FRONTEND_URL=http://localhost:8080
    volumes:
      - db_data:/data
      - ~/.config/earthengine:/root/.config/earthengine:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
